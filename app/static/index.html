<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">▼</div>
                <div class="logo-text">
                    <h1>Media Downloader</h1>
                    <span class="badge">Multi-Platform</span>
                </div>
            </div>
            <button id="open-folder-btn" class="btn-secondary" title="Open Downloads Folder">
                <span class="icon">📁</span> Open Folder
            </button>
        </header>

        <main class="main-card">
            <div class="input-group">
                <label for="url-input">Video or Playlist URL</label>
                <div class="input-wrapper">
                    <input 
                        type="url" 
                        id="url-input" 
                        placeholder="Paste YouTube, TikTok, Vimeo, Twitter, or any video link..." 
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="inspect-btn" class="btn-primary">Inspect</button>
                </div>
            </div>

            <!-- Loading Spinner for Inspection -->
            <div id="inspect-loading" class="loading-state hidden">
                <div class="spinner"></div>
                <span>Analyzing media streams & formats...</span>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="alert-banner hidden"></div>

            <!-- Media Preview Card -->
            <div id="media-preview" class="media-card hidden">
                <img id="media-thumb" class="media-thumb" src="" alt="Thumbnail">
                <div class="media-details">
                    <h3 id="media-title">Video Title</h3>
                    <div class="media-meta">
                        <span id="media-author" class="meta-item"></span>
                        <span id="media-duration" class="meta-item"></span>
                        <span id="media-playlist-tag" class="meta-item tag hidden">Playlist</span>
                    </div>
                </div>
            </div>

            <!-- Format Selector Controls -->
            <div id="format-controls" class="controls-panel hidden">
                <div class="mode-toggle-group">
                    <button type="button" id="mode-video" class="mode-btn active">
                        <span class="icon">🎬</span> Video
                    </button>
                    <button type="button" id="mode-audio" class="mode-btn">
                        <span class="icon">🎵</span> Audio
                    </button>
                </div>

                <div class="options-grid">
                    <div class="option-field">
                        <label id="variant-label" for="variant-select">Select Resolution</label>
                        <select id="variant-select" class="custom-select">
                            <option value="best">Best Available Quality</option>
                        </select>
                    </div>

                    <div id="playlist-option-container" class="option-field checkbox-field hidden">
                        <label class="checkbox-label">
                            <input type="checkbox" id="playlist-checkbox">
                            <span>Download All Videos in Playlist</span>
                        </label>
                    </div>
                </div>

                <!-- Advanced Options Toggle -->
                <div class="advanced-section">
                    <button type="button" id="advanced-toggle" class="toggle-link">
                        <span>▶</span> Advanced (Cookies & Premium)
                    </button>
                    <div id="advanced-content" class="advanced-box hidden">
                        <label for="cookies-path">Cookie File Path (Optional for YouTube Premium)</label>
                        <input type="text" id="cookies-path" placeholder="e.g. /home/yash/cookies.txt">
                        <p class="field-hint">Used for 1080p Premium enhanced bitrate and member-only videos.</p>
                    </div>
                </div>

                <div class="action-row">
                    <button id="download-btn" class="btn-download">
                        Start Download
                    </button>
                </div>
            </div>

            <!-- Active Download Progress -->
            <div id="progress-container" class="progress-box hidden">
                <div class="progress-header">
                    <span id="progress-status" class="status-label">Downloading...</span>
                    <span id="progress-percent" class="percent-label">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-footer">
                    <span id="progress-speed" class="meta-sub">Speed: --</span>
                    <span id="progress-eta" class="meta-sub">ETA: --</span>
                </div>
            </div>
        </main>

        <!-- Completed Downloads List -->
        <section class="history-section">
            <div class="history-header">
                <h2>Downloaded Files</h2>
                <button id="refresh-history-btn" class="btn-ghost">Refresh</button>
            </div>
            <div id="downloads-list" class="downloads-list">
                <div class="empty-state">No downloads yet. Downloaded files will appear here.</div>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
